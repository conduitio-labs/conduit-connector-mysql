name: property-nightly

# The long run of the property tests (pgregory.net/rapid). The test job runs
# every rapid test at RAPID_CHECKS=100 on every PR. This job reruns, with many
# more cases, the tests whose name contains "Property" (the -run filter
# below); the test job's check-property-names step fails a PR whose rapid
# test would be left out. The properties need no database, so this job
# starts none.
#
# A failure prints the -rapid.seed that replays it locally.

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  property:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Property tests, long run
        env:
          RAPID_CHECKS: "20000"
        run: go test -race -count=1 -timeout 30m -run 'Property' ./...
