name: test

on:
  # Pushes made by GITHUB_TOKEN (dependabot auto-merge) do not trigger the
  # push event, so without a schedule main is never tested after a merge.
  schedule:
    - cron: '58 6 * * 1'
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.39
        env:
          MYSQL_DATABASE: meroxadb
          MYSQL_USER: meroxauser
          MYSQL_PASSWORD: meroxapass
          MYSQL_ROOT_PASSWORD: meroxaadmin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=1s
          --health-timeout=20s
          --health-retries=30
          --health-start-period=10s
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Test
        run: go test -v -race -count=1 ./...
