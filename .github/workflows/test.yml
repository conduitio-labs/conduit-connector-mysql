name: test

on:
  # Pushes made by GITHUB_TOKEN (dependabot auto-merge) do not trigger the
  # push event, so without a schedule main is never tested after a merge.
  schedule:
    - cron: '58 6 * * 1'
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.39
        env:
          MYSQL_DATABASE: meroxadb
          MYSQL_USER: meroxauser
          MYSQL_PASSWORD: meroxapass
          MYSQL_ROOT_PASSWORD: meroxaadmin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=1s
          --health-timeout=20s
          --health-retries=30
          --health-start-period=10s
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Property tests are named for the nightly run
        # property-nightly.yml selects its long run with -run Property; this
        # fails when a rapid test would be left out. See
        # .github/scripts/check-property-names/main.go for the rule; the
        # go test runs the checker's own fixtures first.
        run: |
          go test ./.github/scripts/check-property-names
          go run ./.github/scripts/check-property-names

      - name: Test
        # Property tests (pgregory.net/rapid) run a small, fixed number of
        # cases here. property-nightly.yml reruns the ones named *Property*
        # with many more.
        env:
          RAPID_CHECKS: "100"
        run: go test -v -race -count=1 -skip '^TestAcceptanceV2$' ./...

      # Kills the source as a real process (SIGKILL) at chosen points and
      # checks no gap, exact resume and monotonic positions; see
      # test/chaos/doc.go.
      - name: SIGKILL chaos
        run: go test -v -race -count=1 -tags chaos ./test/chaos/

      # The SDK acceptance suite v2 (revision pinned by the SDK in go.mod). The
      # report is the certification evidence: it is deleted first so a stale one
      # can never pass, and it only counts if the run finished and is complete.
      - name: Acceptance suite v2
        run: |
          rm -f acceptance-report.json
          CONDUIT_ACCEPTANCE_REPORT="$PWD/acceptance-report.json" \
            go test -v -race -count=1 -run '^TestAcceptanceV2$' .

      - name: Check acceptance report
        if: always()
        run: |
          test -f acceptance-report.json || { echo "acceptance report missing: the run did not start or crashed"; exit 1; }
          jq '{suite_revision, sdk_version, finished, complete, passed, unexplained_skips, capabilities, limits, exceptions,
               cases: [.cases[] | {id, name, outcome, skip_kind}]}' acceptance-report.json
          jq -e '.finished == true and .complete == true and .passed == true' acceptance-report.json

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: acceptance-report.json
          if-no-files-found: warn
